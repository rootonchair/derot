[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "derot"
dynamic = ["version"]
description = "One terminal console for every Claude Code session across projects, accounts and machines"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rootonchair"}]
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "tmux", "tui", "terminal", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=4.0",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/rootonchair/derot"
Issues = "https://github.com/rootonchair/derot/issues"
Changelog = "https://github.com/rootonchair/derot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "pyflakes"]

[project.scripts]
derot = "derot.cli:main"

[tool.setuptools]
packages = ["derot"]

[tool.setuptools.dynamic]
version = {attr = "derot.__version__"}

[tool.setuptools.package-data]
derot = ["example_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
