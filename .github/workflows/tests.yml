name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release workflow runs these first

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - name: Install
        run: pip install -e '.[test]'
      - name: Lint
        run: python -m pyflakes derot tests scripts
      - name: Test
        run: python -m pytest -q
