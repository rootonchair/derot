name: release

# Push a tag like v0.1.0 to publish that version to PyPI (and make a GitHub release).
# Run it by hand ("Run workflow") to publish the current main to TestPyPI as a dry run.
# Publishing uses PyPI Trusted Publishing: no tokens; see RELEASING.md for the one-time setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('derot/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match __version__ = $version in derot/__init__.py"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-check:
    needs: build
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install the built wheel and run it
        run: |
          python -m pip install dist/*.whl
          derot --version
          derot --help > /dev/null

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, install-check]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/derot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'push'
    needs: [tests, install-check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/derot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "derot $version" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "derot $version" --notes-file notes.md
